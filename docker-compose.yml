services:
  db-cis: 
    image: postgres:alpine3.24
    container_name: computer_inventory_db
    restart: always
    environment:
      POSTGRES_USER: ${CIS_DB_USER} 
      POSTGRES_PASSWORD: ${CIS_DB_PASSWORD}
    volumes:
      - com_inven_vol_new_2:/var/lib/postgresql
    networks:
      - computer_invertory_network

volumes:
  com_inven_vol_new_2: